[package]
name = "n0m1-sensorlab"
version = "0.1.0"
edition = "2021"
description = "A small, inspectable sensor token and surprise learning loop"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

